[project]
name = "material_price_control"
authors = [
    { name = "Sagar Ratan Garg", email = "sagarratangarg@gmail.com"}
]
description = "Material Valuation Control is an ERPNext module that prevents cost valuation errors by detecting and blocking unusual material valuation rates during purchase receipts, purchase invoices, and stock entries. It helps maintain accurate inventory valuation by comparing incoming rates against expected rates and alerting users to potential data entry mistakes or pricing anomalies."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe and erpnext are installed and managed by bench, not pip.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe ecosystem version compatibility declared per
# https://docs.frappe.io/cloud/custom-apps/app-versioning/versioning
# Picked up by bench and Frappe Cloud Marketplace to gate installs.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
